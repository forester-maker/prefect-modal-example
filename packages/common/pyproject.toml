[project]
name = "starter-common"
version = "0.1.0"
description = "Shared helpers used by every flow package in this repo"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.7,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter_common"]
