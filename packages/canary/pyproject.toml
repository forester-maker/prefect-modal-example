[project]
name = "starter-canary"
version = "0.1.0"
description = "Tiny flow deployed on every push to main to prove CI can reach Prefect Cloud and run work"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.7,<4",
    "starter-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter_canary"]

[tool.uv.sources]
starter-common = { workspace = true }
