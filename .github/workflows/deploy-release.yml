# Tag v*: build and push the image once, then deploy every deployment in
# prefect.yaml to each environment's workspace.
#
# Environments are GitHub Environments (Settings → Environments). Each one holds
# its own PREFECT_API_URL and PREFECT_API_KEY secrets, so one prefect.yaml fans
# out to dev, staging and production workspaces. Put required reviewers on
# `production` and the deploy job waits for approval while dev and staging
# proceed.
#
# Knobs:
#   vars.DEPLOY_ENVIRONMENTS  JSON list of environments. Default ["dev","staging","production"].
#   vars.IMAGE_REGISTRY       default ghcr.io. For ECR set e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com
#                             and swap the login step (see README).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"   # ghcr requires lowercase
          echo "image=${REGISTRY}/${repo}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.DEPLOY_ENVIRONMENTS || '["dev","staging","production"]') }}
    environment: ${{ matrix.environment }}
    env:
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      IMAGE: ${{ needs.build-image.outputs.image }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REPO_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --no-dev

      - name: Deploy all
        run: uv run prefect deploy --all
